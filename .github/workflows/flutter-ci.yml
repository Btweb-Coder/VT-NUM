name: Flutter CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/onboarding/first_time_app_guide.dart
          lib/features/onboarding/onboarding_gate.dart
          lib/features/auth/pages/auth_gate.dart
          lib/features/home/home_page.dart
          lib/features/activate/pages/activate_page.dart
          lib/features/activate/widgets/tnum_activation_panel.dart
          lib/features/active/pages/active_page.dart
          lib/features/active/widgets/tnum_active_section.dart
          lib/features/orders/pages/orders_page.dart
          lib/features/wallet/pages/wallet_page.dart
          lib/app/router.dart
          lib/features/referrals
          lib/core/widgets/activation_card.dart
          lib/core/services/auth_service.dart

      - name: Run Flutter tests
        run: flutter test test/onboarding test/referrals
